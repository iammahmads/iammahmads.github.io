name: Scheduled Portfolio Rebuild

on:
  schedule:
    # Rebuild daily at 04:00 UTC to sync GitHub projects and refresh pre-rendered static HTML
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Please add it to GitHub repository secrets to enable automated scheduled rebuilds."
            exit 0
          fi
          echo "Triggering Render deploy hook..."
          curl -s -S -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
